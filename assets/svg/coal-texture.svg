<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0a0e17"/>
  <rect width="200" height="200" fill="none" filter="url(#noise)" opacity="0.12"/>
  <!-- Subtle veins -->
  <path d="M 0 45 Q 50 40, 80 60 T 150 50 T 200 55" stroke="#1a2030" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M 0 120 Q 30 110, 70 130 T 140 115 T 200 125" stroke="#1a2030" stroke-width="0.5" fill="none" opacity="0.2"/>
  <path d="M 0 170 Q 60 165, 100 180 T 200 172" stroke="#151c2a" stroke-width="0.5" fill="none" opacity="0.25"/>
</svg>
